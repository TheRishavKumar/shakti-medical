<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#00d4a0">
  <title>Om Shakti Medical — Login</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

  <style>
    /* ── LOGIN PAGE FULL SCREEN ── */
    html, body {
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh; /* dynamic viewport for mobile browsers */
      margin: 0;
      padding: 0;
    }

    body.login-page {
      background: radial-gradient(ellipse at 60% 40%, #0d2040 0%, #060c18 70%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      min-height: 100vh;
      min-height: 100dvh;
    }

    .login-card {
      background: #111827;
      border: 1px solid #2a3650;
      border-radius: 16px;
      padding: 36px 24px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.6);
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, #00d4a0, #00a8ff);
    }

    .login-logo {
      font-size: 52px;
      display: block;
      margin-bottom: 12px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50%       { transform: translateY(-8px); }
    }

    .login-card h1 {
      font-family: 'Syne', sans-serif;
      font-size: 22px;
      font-weight: 800;
      color: #00d4a0;
      margin-bottom: 4px;
    }

    .login-sub {
      color: #7a8aaa;
      font-size: 13px;
      margin-bottom: 28px;
    }

    .login-input {
      width: 100%;
      padding: 13px 16px;
      border-radius: 8px;
      border: 1px solid #2a3650;
      background: #1a2236;
      color: #e8edf5;
      font-size: 16px; /* 16px stops iOS zoom */
      font-family: 'DM Sans', Arial, sans-serif;
      margin-bottom: 12px;
      box-sizing: border-box;
      transition: border-color 0.2s;
      -webkit-appearance: none;
      appearance: none;
    }

    .login-input:focus {
      outline: none;
      border-color: #00d4a0;
      box-shadow: 0 0 0 3px rgba(0,212,160,0.18);
    }

    .login-input::placeholder { color: #7a8aaa; }

    .login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 4px;
      background: #00d4a0;
      border: none;
      border-radius: 8px;
      color: #0a0f1e;
      font-size: 15px;
      font-weight: 700;
      font-family: 'DM Sans', Arial, sans-serif;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .login-btn:hover   { background: #00edb3; }
    .login-btn:active  { transform: scale(0.98); }

    .flash {
      padding: 10px 14px;
      border-radius: 8px;
      margin-bottom: 14px;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 8px;
      border-left: 3px solid;
      text-align: left;
    }

    .flash.danger {
      background: rgba(255,77,109,.1);
      border-color: #ff4d6d;
      color: #ff4d6d;
    }

    .loader {
      display: none;
      margin: 14px auto 0;
      width: 28px;
      height: 28px;
      border: 3px solid #2a3650;
      border-top-color: #00d4a0;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>

<body class="login-page">

  <div class="login-card">

    <span class="login-logo">⚕️</span>
    <h1>Shakti Medical</h1>
    <p class="login-sub">Medical Store Management System</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="flash {{ category }}">❌ {{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" onsubmit="showLoader()">
      <input class="login-input" type="text"     name="username" placeholder="Username" required autofocus autocomplete="username">
      <input class="login-input" type="password" name="password" placeholder="Password" required autocomplete="current-password">
      <button type="submit" class="login-btn">Login →</button>
      <div class="loader" id="loader"></div>
    </form>

  </div>

<script>
function showLoader() {
  document.getElementById('loader').style.display = 'block';
}
</script>

</body>
</html>
